name: CI/CD — Deploy to local server

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-eye-budget-production
  cancel-in-progress: false

jobs:
  ci-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate backend .env from secrets
        run: |
          {
            echo "INPUT_DIR=/mnt/nextcloud/data/Domek/files/Budżet domowy/Paragony"
            echo "OUTPUT_DIR=preprocessed/"
            echo "PREPROCESSED_IMAGE_EXTENSION=png"
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            echo "POSTGRESQL_HOST=${{ secrets.POSTGRESQL_HOST }}"
            echo "POSTGRESQL_PORT=${{ secrets.POSTGRESQL_PORT }}"
            echo "POSTGRESQL_USER=${{ secrets.POSTGRESQL_USER }}"
            echo "POSTGRESQL_PASSWORD=${{ secrets.POSTGRESQL_PASSWORD }}"
            echo "POSTGRESQL_DB=${{ secrets.POSTGRESQL_DB }}"
            echo "MODEL=gpt-5"
            echo "MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}"
            echo "MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}"
            echo "MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}"
            echo "MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}"
            echo "MINIO_SECURE=${{ secrets.MINIO_SECURE }}"
            echo "REDIS_URL=${{ secrets.REDIS_URL }}"
            echo "SOKETI_APP_ID=${{ secrets.SOKETI_APP_ID }}"
            echo "SOKETI_APP_KEY=${{ secrets.SOKETI_APP_KEY }}"
            echo "SOKETI_APP_SECRET=${{ secrets.SOKETI_APP_SECRET }}"
            echo "SOKETI_HOST=${{ secrets.SOKETI_HOST }}"
            echo "SOKETI_PORT=${{ secrets.SOKETI_PORT }}"
          } > backend/.env

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python environment
        run: |
          [ -d venv ] || python3 -m venv venv
          ./venv/bin/pip install --quiet -r backend/requirements-test.txt

      - name: Run backend tests
        run: ../venv/bin/python -m pytest
        working-directory: backend

      - name: Tag current image as previous
        run: docker tag eye-budget-frontend:latest eye-budget-frontend:previous 2>/dev/null || true

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }} \
            --build-arg NEXT_PUBLIC_PUSHER_WS_HOST=${{ secrets.NEXT_PUBLIC_PUSHER_WS_HOST }} \
            --build-arg NEXT_PUBLIC_PUSHER_WS_PORT=${{ secrets.NEXT_PUBLIC_PUSHER_WS_PORT }} \
            -t eye-budget-frontend:latest \
            ./frontend

      - name: Stop and remove old container
        run: |
          docker stop eye-budget-frontend || true
          docker rm eye-budget-frontend || true

      - name: Start new container
        run: |
          docker run -d \
            --name eye-budget-frontend \
            -p 3000:3000 \
            --restart unless-stopped \
            eye-budget-frontend:latest

      - name: Verify deployment health
        run: curl --retry 5 --retry-delay 5 --retry-connrefused -f http://localhost:3000/api/health

      - name: Rollback to previous image
        if: failure()
        run: |
          docker stop eye-budget-frontend || true
          docker rm eye-budget-frontend || true
          docker image inspect eye-budget-frontend:previous &>/dev/null \
            && docker run -d \
                --name eye-budget-frontend \
                -p 3000:3000 \
                --restart unless-stopped \
                eye-budget-frontend:previous \
            || echo "No previous image available — server may be down"

      - name: Deployment summary
        if: success()
        run: echo "✅ Deployed at $(date -u) — http://192.168.1.184:3000" >> $GITHUB_STEP_SUMMARY
